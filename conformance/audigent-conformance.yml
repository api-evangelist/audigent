summary: >-
  Audigent's conformance posture is entirely advertising-industry standards and
  privacy self-regulation — not API standards. It is a registered IAB Europe TCF
  vendor with a live, machine-readable device-storage disclosure, it emits and
  honours TCF / US Privacy / GPP consent strings on its public endpoints, and it
  speaks OpenRTB and the Prebid.js module contracts. It conforms to no API-design
  standard: no OpenAPI, no RFC 9457 problem details, no OAuth 2.0, no OpenID
  Connect, no RFC 8594 deprecation headers, no /.well-known catalog.

