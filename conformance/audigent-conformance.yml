certifications_published: false
certifications_note: >-
  Audigent names no security certification (no SOC 2, ISO 27001, PCI or HIPAA)
  on any public page, and publishes no trust center. trust.audigent.com does not
  resolve with a valid certificate. Its published compliance posture is entirely
  privacy/advertising self-regulation, listed above. Experian, its parent since
  December 2024, maintains its own separate certifications; those are not
  asserted here because Audigent does not publish them on its own surface.
