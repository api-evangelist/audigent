  note: No public SLA, uptime commitment or support-tier document.

changelog:
  published: false
  note: >-
    No dated changelog on any Audigent host. The nearest thing is the corporate
    blog at https://audigent.com/blog/ (announcements, not release notes) and the
    upstream prebid/Prebid.js commit history for the three Audigent modules.
    No `ChangeLog` pointer is emitted.

