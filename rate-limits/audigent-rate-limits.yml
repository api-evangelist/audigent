method: probed
source: >-
  live anonymous requests to https://id.hadron.ad.gt/api/v1/pbhid ,
  https://seg.hadron.ad.gt/api/v1/rtd , https://analytics.hadron.ad.gt/api/v1/analytics ,
  https://uid2.hadron.ad.gt/v1/hadron.json (2026-08-12) ;
  https://docs.prebid.org/dev-docs/modules/userid-submodules/hadron.html ;
  https://docs.prebid.org/dev-docs/modules/hadronRtdProvider.html

limit_count: 0

summary: >-
  Audigent publishes no rate limits and its public endpoints emit no rate-limit
  headers. Full response headers were captured from all four live public hosts on
  2026-08-12: not one carries X-RateLimit-*, RateLimit-*, Retry-After or any
  quota signal, and the Prebid documentation pages that serve as Audigent's only
  developer reference say nothing about throttling, quotas or 429 handling. An
  agent calling this surface has no runtime signal to back off on, and no
  documented number to plan against. Recorded as an honest zero.

limits: []

