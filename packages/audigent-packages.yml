summary: >-
  Audigent publishes NO first-party package on any public registry. Every public
  registry was searched by name on 2026-08-12 and every one returned zero
  Audigent-owned results. Audigent's client code reaches developers by exactly
  two routes, both recorded below: (1) three open-source Prebid.js submodules
  that Audigent authors but that ship inside the upstream `prebid.js` npm
  package, which Audigent does not own; and (2) one unpinned JavaScript bundle
  served from Audigent's own CDN at cdn.hadronid.net. Neither is an installable
  first-party SDK, so NO `SDKs` pointer is emitted in apis.yml — the
  `sdk_count` checks would otherwise be credited for a library Audigent does not
  publish.

