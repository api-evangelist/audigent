first_party_module_maintenance:
  note: >-
    The three Audigent modules live upstream, so their maintenance history is
    public and dated — and it is the strongest decay signal available for this
    provider. Audigent-side engineering on them stopped in late 2024, immediately
    around the December 2024 Experian acquisition. Every commit since is
    Prebid-core housekeeping by Prebid maintainers (lint rules, the Prebid 9/10/11
    breaking-change sweeps) or a third-party contribution, not Audigent feature
    work.
  source: https://api.github.com/repos/prebid/Prebid.js/commits?path=modules/<module>.js
