plan_count: 0

summary: >-
  Audigent publishes no pricing of any kind — no plans page, no tiers, no rate
  card, no free tier, no self-serve signup. Its whole commercial motion is
  sales-led: publishers and advertisers are routed to a contact form or a "Request
  Demo" button, and the Hadron integration itself requires a numeric partner_id
  that Audigent issues manually during onboarding ("This is the Audigent Partner
  ID obtained from Audigent" — Prebid docs). Recorded as an explicit zero with
  evidence, not omitted.

plans: []

