  published: false
  probed:
  - url: https://audigent.com/pricing
    http_status: 200
    verdict: does-not-exist
    note: >-
      audigent.com answers 200 with the marketing index for every unknown path.
      This response is byte-identical to the control path
      https://audigent.com/zzz-control-9999 (both 128,509 bytes, both titled
      "Audigent | The Leading Data Activation, Curation and Identity Platform"),
      so the 200 is a soft-404 and NOT evidence of a pricing page. Diffing
      against the control is the only reliable read on this host.
  - url: https://audigent.com/zzz-control-9999
    http_status: 200
    bytes: 128509
    verdict: control — soft-404 signature
  - url: https://audigent.com/contact-us/
    http_status: 200
    bytes: 107324
    verdict: real page (distinct title "Contact Us | Audigent"), differs from control
