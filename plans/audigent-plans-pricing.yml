  - {kind: request-demo CTA, url: 'https://audigent.com/', note: 'button in the site header, routes to the contact form'}
  - {kind: partner onboarding, url: 'https://docs.prebid.org/dev-docs/modules/hadronRtdProvider.html', note: 'partnerId is issued by Audigent, not self-serve'}
  - {kind: integration support, contact: prebid@audigent.com, source: 'https://docs.prebid.org/dev-docs/modules/userid-submodules/hadron.html'}
  self_serve_signup: false
