aid: audigent
name: Audigent
description: 'Audigent is a data activation, curation and identity platform for digital
  advertising, acquired by Experian in December 2024 and now operated as part of Experian
  Marketing Services. Its products include the Hadron ID cookieless identifier, the
  SmartPMP, ContextualPMP and CognitivePMP private-marketplace suites, a first-party
  data platform for publishers and advertisers, and the 1st Unit rich-media format.
  Audigent''s public technical surface is not a documented REST developer program:
  it is a set of live ad-tech identity, segment and analytics endpoints on the ad.gt
  and hadronid.net domains, reached through first-party open-source Prebid.js modules
  (hadronIdSystem, hadronRtdProvider, hadronAnalyticsAdapter) that Audigent authors
  and maintains upstream in the Prebid.js project. Audigent is IAB Europe TCF Global
  Vendor List vendor 561 and publishes a machine-readable device-storage disclosure.'
