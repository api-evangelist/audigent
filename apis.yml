apis:
- name: Hadron ID API
  description: 'Public, anonymous identity-resolution endpoint that returns Audigent''s
    cookieless Hadron ID (plus hadronIdv2 and the legacy haloId) for the calling browser.
    Called by the Prebid.js hadronIdSystem user-id submodule. Accepts a partner_id
    identifier and consent signals (gdpr, gdprString, us_privacy, gpp, gpp_sid) as
    query parameters and responds with JSON. No OpenAPI is published; the request
    contract is legible in the open-source Prebid.js module source.'
  humanURL: https://docs.prebid.org/dev-docs/modules/userid-submodules/hadron.html
  baseURL: https://id.hadron.ad.gt/api/v1
  tags:
  - Identity
  - AdTech
  - Prebid
  properties:
  - type: Documentation
    url: https://docs.prebid.org/dev-docs/modules/userid-submodules/hadron.html
  - type: SourceCode
    url: https://github.com/prebid/Prebid.js/blob/master/modules/hadronIdSystem.js
- name: Hadron Real-Time Data (RTD) API
  description: 'Segment and real-time-data endpoint returning an OpenRTB ortb2 fragment
    used to enrich a Prebid auction with Audigent audience segments and contextual
    signals. Backed by the hadronRtdProvider Prebid.js module and the hadron.js loader
    served from cdn.hadronid.net. Requires an Audigent-issued numeric partnerId.'
  humanURL: https://docs.prebid.org/dev-docs/modules/hadronRtdProvider.html
  baseURL: https://seg.hadron.ad.gt/api/v1
  tags:
  - AdTech
  - Audience
  - Prebid
  properties:
  - type: Documentation
    url: https://docs.prebid.org/dev-docs/modules/hadronRtdProvider.html
  - type: SourceCode
    url: https://github.com/prebid/Prebid.js/blob/master/modules/hadronRtdProvider.js
- name: Hadron Analytics API
  description: 'Analytics collection endpoint for the hadronAnalyticsAdapter Prebid.js
    analytics adapter. Receives auction lifecycle events (auctionInit, auctionEnd,
    bidWon and related) keyed to an Audigent partnerId. Accepts GET, POST and OPTIONS;
    no public request schema is published.'
  humanURL: https://docs.prebid.org/dev-docs/analytics/audigent.html
  baseURL: https://analytics.hadron.ad.gt/api/v1
  tags:
  - Analytics
  - AdTech
  - Prebid
  properties:
  - type: Documentation
    url: https://docs.prebid.org/dev-docs/analytics/audigent.html
  - type: SourceCode
    url: https://github.com/prebid/Prebid.js/blob/master/modules/hadronAnalyticsAdapter.js
- name: Audigent Platform API
  description: 'Authenticated platform API behind the Audigent admin console. The host
    is live (gunicorn/Django) but every anonymous request 302s to the admin.audigent.com
    login, and no public reference, OpenAPI or developer portal is published for it.
    Access is customer/partner-only.'
  humanURL: https://admin.audigent.com/
  baseURL: https://api.audigent.com
  tags:
  - Platform
  - AdTech
  properties:
  - type: Login
    url: https://admin.audigent.com/
